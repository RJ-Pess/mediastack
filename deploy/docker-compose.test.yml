# Só para testes: um Jellyfin real e vazio, um indexador falso e portas publicadas para o Playwright.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    networks: [mediastack]
    ports: ['18096:8096']
  mock-indexer:
    image: node:22-alpine
    command: ['node', '/srv/server.mjs']
    volumes: ['../tests/mock-indexer:/srv:ro']
    networks: [mediastack]
  seerr:
    ports: ['15055:5055']
  radarr:
    ports: ['17878:7878']
  prowlarr:
    ports: ['19696:9696']

networks:
  mediastack: {}
