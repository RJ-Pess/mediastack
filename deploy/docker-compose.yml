name: mediastack

x-common: &common
  restart: unless-stopped
  networks: [mediastack]
  security_opt: ['no-new-privileges:true']

x-lsio-env: &lsio-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-UTC}
  UMASK: ${UMASK:-002}

services:
  mediastack-init:
    image: ${MEDIASTACK_IMAGE:-mediastack:local}
    container_name: mediastack-init
    command: ['node', 'dist/index.js', 'init']
    restart: 'no'
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ['no-new-privileges:true']
    networks: [mediastack]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      MEDIASTACK_TORRENT_PORT: ${TORRENT_PORT:-6882}
      MEDIASTACK_DATA_ROOT: /data
    volumes:
      - ${CONFIG_ROOT:-./config}:/configs
      - ${CONFIG_ROOT:-./config}/mediastack/secrets:/run/mediastack
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data

  mediastack:
    <<: *common
    image: ${MEDIASTACK_IMAGE:-mediastack:local}
    container_name: mediastack
    ports: ['${MEDIASTACK_PORT:-8088}:8080']
    user: '${PUID:-1000}:${PGID:-1000}'
    cap_drop: [ALL]
    volumes:
      - ${CONFIG_ROOT:-./config}/mediastack/data:/config
      - ${CONFIG_ROOT:-./config}/mediastack/recyclarr:/recyclarr
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data
      - ${CONFIG_ROOT:-./config}/mediastack/secrets:/run/mediastack:ro
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
      sonarr: { condition: service_healthy }
      radarr: { condition: service_healthy }
      prowlarr: { condition: service_healthy }

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: seerr
    # A imagem corre como não-root: alinha com o dono da pasta de config (ver o init).
    user: '${PUID:-1000}:${PGID:-1000}'
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    environment: { TZ: '${TZ:-UTC}' }
    volumes: ['${CONFIG_ROOT:-./config}/seerr:/app/config']

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      FILE__SONARR__AUTH__APIKEY: /run/mediastack/sonarr.key
      SONARR__AUTH__METHOD: External
    volumes:
      - ${CONFIG_ROOT:-./config}/mediastack/secrets:/run/mediastack:ro
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data
    healthcheck: &hc-ping
      test: ['CMD-SHELL', 'curl -fs http://localhost:8989/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      FILE__RADARR__AUTH__APIKEY: /run/mediastack/radarr.key
      RADARR__AUTH__METHOD: External
    volumes:
      - ${CONFIG_ROOT:-./config}/mediastack/secrets:/run/mediastack:ro
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data
    healthcheck:
      <<: *hc-ping
      test: ['CMD-SHELL', 'curl -fs http://localhost:7878/ping || exit 1']

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      FILE__PROWLARR__AUTH__APIKEY: /run/mediastack/prowlarr.key
      PROWLARR__AUTH__METHOD: External
    volumes:
      - ${CONFIG_ROOT:-./config}/mediastack/secrets:/run/mediastack:ro
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    healthcheck:
      <<: *hc-ping
      test: ['CMD-SHELL', 'curl -fs http://localhost:9696/ping || exit 1']

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    environment: *lsio-env
    volumes:
      - ${CONFIG_ROOT:-./config}/bazarr:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      WEBUI_PORT: '8080'
      TORRENTING_PORT: '${TORRENT_PORT:-6882}'
    ports:
      - '${TORRENT_PORT:-6882}:${TORRENT_PORT:-6882}'
      - '${TORRENT_PORT:-6882}:${TORRENT_PORT:-6882}/udp'
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data

  recyclarr:
    <<: *common
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: '${PUID:-1000}:${PGID:-1000}'
    depends_on:
      mediastack-init: { condition: service_completed_successfully }
    # O sync.sh é copiado para esta pasta pelo mediastack-init (vem na imagem do MediaStack).
    entrypoint: ['/bin/sh', '/config/sync.sh']
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/mediastack/recyclarr:/config

  byparr:
    <<: *common
    image: ghcr.io/thephaseless/byparr:3.0.4
    container_name: byparr

networks:
  mediastack: {}

x-casaos:
  architectures: [amd64, arm64]
  main: mediastack
  title: { pt_pt: MediaStack, en_us: MediaStack }
  tagline: { pt_pt: Painel único para o stack de media, en_us: Single panel for the media stack }
  category: Media
  port_map: '8088'
  index: /
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyseerr.png
