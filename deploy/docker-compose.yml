name: cais

x-common: &common
  restart: unless-stopped
  networks: [cais]
  security_opt: ['no-new-privileges:true']

x-lsio-env: &lsio-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-UTC}
  UMASK: ${UMASK:-002}

services:
  cais-init:
    image: ${CAIS_IMAGE:-cais:local}
    container_name: cais-init
    command: ['node', 'dist/index.js', 'init']
    restart: 'no'
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ['no-new-privileges:true']
    networks: [cais]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      CAIS_TORRENT_PORT: ${TORRENT_PORT:-6882}
      CAIS_DATA_ROOT: /data
    volumes:
      - ${CONFIG_ROOT:-./config}:/configs
      - ${CONFIG_ROOT:-./config}/cais/secrets:/run/cais
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data

  cais:
    <<: *common
    image: ${CAIS_IMAGE:-cais:local}
    container_name: cais
    ports: ['${CAIS_PORT:-8088}:8080']
    user: '${PUID:-1000}:${PGID:-1000}'
    cap_drop: [ALL]
    volumes:
      - ${CONFIG_ROOT:-./config}/cais/data:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data
      - ${CONFIG_ROOT:-./config}/cais/secrets:/run/cais:ro
    depends_on:
      cais-init: { condition: service_completed_successfully }
      sonarr: { condition: service_healthy }
      radarr: { condition: service_healthy }
      prowlarr: { condition: service_healthy }

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest # TODO: fixar versão
    container_name: seerr
    depends_on:
      cais-init: { condition: service_completed_successfully }
    environment: { TZ: '${TZ:-UTC}' }
    volumes: ['${CONFIG_ROOT:-./config}/seerr:/app/config']

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest # TODO: fixar versão
    container_name: sonarr
    depends_on:
      cais-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      FILE__SONARR__AUTH__APIKEY: /run/cais/sonarr.key
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_ROOT:-./config}/cais/secrets:/run/cais:ro
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data
    healthcheck: &hc-ping
      test: ['CMD-SHELL', 'curl -fs http://localhost:8989/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest # TODO: fixar versão
    container_name: radarr
    depends_on:
      cais-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      FILE__RADARR__AUTH__APIKEY: /run/cais/radarr.key
      RADARR__AUTH__METHOD: Forms
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_ROOT:-./config}/cais/secrets:/run/cais:ro
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data
    healthcheck:
      <<: *hc-ping
      test: ['CMD-SHELL', 'curl -fs http://localhost:7878/ping || exit 1']

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest # TODO: fixar versão
    container_name: prowlarr
    depends_on:
      cais-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      FILE__PROWLARR__AUTH__APIKEY: /run/cais/prowlarr.key
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
    volumes:
      - ${CONFIG_ROOT:-./config}/cais/secrets:/run/cais:ro
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    healthcheck:
      <<: *hc-ping
      test: ['CMD-SHELL', 'curl -fs http://localhost:9696/ping || exit 1']

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest # TODO: fixar versão
    container_name: bazarr
    depends_on:
      cais-init: { condition: service_completed_successfully }
    environment: *lsio-env
    volumes:
      - ${CONFIG_ROOT:-./config}/bazarr:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest # TODO: fixar versão
    container_name: qbittorrent
    depends_on:
      cais-init: { condition: service_completed_successfully }
    environment:
      <<: *lsio-env
      WEBUI_PORT: '8080'
      TORRENTING_PORT: '${TORRENT_PORT:-6882}'
    ports:
      - '${TORRENT_PORT:-6882}:${TORRENT_PORT:-6882}'
      - '${TORRENT_PORT:-6882}:${TORRENT_PORT:-6882}/udp'
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT:?defina DATA_ROOT no .env (raiz de dados partilhada)}:/data

  byparr:
    <<: *common
    image: ghcr.io/thephaseless/byparr:latest # TODO: fixar versão
    container_name: byparr

networks:
  cais: {}

x-casaos:
  architectures: [amd64, arm64]
  main: cais
  title: { pt_pt: Cais, en_us: Cais }
  tagline: { pt_pt: Painel único para o stack de media, en_us: Single panel for the media stack }
  category: Media
  port_map: '8088'
  index: /
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyseerr.png
