name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Repositório público: só runners hospedados pelo GitHub (nunca self-hosted).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: MEDIASTACK_IT_DIR="$RUNNER_TEMP/mediastack-it" ./scripts/integration.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64 + arm64) para validar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build amd64 local para o scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mediastack:scan
      - name: Trivy (CVEs críticos)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mediastack:scan
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Verifica que corre como não-root
        run: |
          test "$(docker run --rm --entrypoint id mediastack:scan -u)" != 0
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # tags imutáveis: sha curto + semver (em tags vX.Y.Z); `latest` só em releases
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
